name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  test:
    uses: ./.github/workflows/test.yml

  publish:
    needs: test
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - if: runner.os != 'macOS'
        run: dotnet publish

      - if: runner.os == 'macOS'
        run: |
          dotnet publish src/Gallean.Client.MacOS -r osx-arm64
          dotnet publish src/Gallean.Client.MacOS -r osx-x64

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*.zip

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ runner.os }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 1

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - run: gh release create "$GITHUB_REF_NAME" dist/*.zip --draft --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
